[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    # PyJWT InsecureKeyLengthWarning fires in test_bad_token_returns_401[wrong_algorithm]
    # because we deliberately mint with HS512 (which wants >=64 byte keys) using the
    # 45-byte HS256 secret. This is intentional — the test exists to prove the server's
    # algorithm allowlist rejects HS512 tokens. The warning is on the test minting side,
    # not production code.
    ignore::jwt.warnings.InsecureKeyLengthWarning
markers =
    timing: timing-sensitive tests (skippable on constrained hardware via -m "not timing")
